name: Check

# The build and the tests on the three supported hosts.  ci.yml calls it for
# every push and pull request, to build warmc and run `make smoke`: a few
# rows of `make check` that reach most of warmc in a minute or so.
# nightly.yml calls it with `full`: the sanitizer builds and the whole of
# `make check`, with every language toolchain installed, so that the
# language test corpora run too.  A corpus whose toolchain is missing skips
# itself, and the benchmark corpora are left to `make bench-compare`.
#
# Everything a job downloads or builds that does not change with warmc is
# cached, and each cache is saved as soon as what it holds is complete, so a
# failing test does not lose it:
#   build/ci/llvm               the trimmed LLVM release (macOS, Linux)
#   build/ci/{wasmtime,wabt,ccache}, build/ci/{jdk,kotlinc,asc}
#                               the pinned release binaries
#   ~/.rustup, ~/.cargo/bin     the pinned Rust toolchain
#   build/tools, build/testsuite  what the Makefile fetches: wasm-tools (a
#                               release binary here, never built), wasi-sdk,
#                               the Kotlin stdlib, the official testsuite
#   build/ci-cache              ccache, the ThinLTO cache, Go's build cache:
#                               saved anew by every run, the latest restored
#   build/testrun/*.{wasm,ref}  the test modules and the interpreter's answers
#                               for them, each with a stamp of what made it
#   build/<corpus>/*.wasm       the language test corpora as their producers
#                               built them, keyed on their sources and every pin
#   ~/.ghc-wasm, the tool cache GHC's wasm backend, Go, TinyGo, Node
#   (Zig)                       setup-zig caches its own
#
# Everything is pinned: actions by commit, every tool to an exact version,
# and every download the scripts and the Makefile make to its SHA-256
# (test/fetch.sha256 for the Makefile's).  What the setup actions download is
# pinned by its exact version.  The runner images cannot be pinned, so what
# a job takes from one is chosen by name where it can be: Xcode on macOS.

on:
  workflow_call:
    inputs:
      full:
        description: Build the sanitizer builds too and run the whole of `make check` with every language toolchain, rather than `make smoke`
        type: boolean
        default: false

permissions: {}

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: ${{ inputs.full && 150 || 20 }}
    permissions:
      contents: read # to check out the repository
    env:
      CC: ccache clang
      ASAN_CC: ccache clang
      XCC: ccache clang
      EXTRA_LDFLAGS: -Wl,-cache_path_lto,build/ci-cache/lto
      CCACHE_DIR: ${{ github.workspace }}/build/ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      GOCACHE: ${{ github.workspace }}/build/ci-cache/go-build
      # the Go of setup-go and no other, which go would otherwise fetch for a
      # go.mod asking for a newer one
      GOTOOLCHAIN: local
      # The image's newest Xcode by name rather than its default, which moves:
      # its SDK and ld64 are what the pinned LLVM links against.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Python the build and every test script run, rather than the
      # image's.  Windows runs MSYS2's own (see below).
      - &setup-python
        name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2

      # The caches are keyed on what they hold -- the pinned versions, and
      # for LLVM which members of the release -- rather than on the text of
      # the scripts, so that editing a script does not throw a cache away.
      # The stamp in each tool's directory still decides whether it is
      # installed again.
      - &pins
        name: Read the pins
        id: pins
        run: |
          s=.github/scripts
          sum() { cksum | cut -d' ' -f1; }
          {
            echo "makefile=$({ grep -E '^(WASM_TOOLS_VERSION|WASI_SDK_VERSION|TEAVM_VERSION|TEAVM_SOURCES|JODA_TIME_VERSION|JZLIB_VERSION|KOTLIN_VERSION) *:=' Makefile
                               cat test/fetch.sha256; } | sum)"
            echo "rust=$(sed -n 's/^RUST_VERSION=//p' $s/install-rust.sh)"
            echo "rustup=$(sed -n 's/^RUSTUP_VERSION=//p' $s/install-rust.sh)"
            echo "llvm=$(grep -E '^LLVM_VERSION=|lib/clang/' $s/install-llvm.sh | sum)"
            echo "tools=$(grep -E '^[A-Z_]+_VERSION=' $s/install-tools.sh | sum)"
            echo "languages=$({ grep -E '^[A-Z_]+_(VERSION|COMMIT|FLAVOUR)=' $s/install-language-tools.sh
                                cat .github/asc/package-lock.json; } | sum)"
            echo "producers=$({ grep -hE '^[A-Z_]+_(VERSION|COMMIT|FLAVOUR)=' $s/*.sh
                               grep -E '(go|tinygo|binaryen|node|java)-version:|^ +version: ' .github/workflows/check.yml; } | sum)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore LLVM
        id: llvm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/llvm
          key: llvm-macos-arm64-${{ steps.pins.outputs.llvm }}

      - name: Install LLVM
        run: .github/scripts/install-llvm.sh

      - name: Save LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - name: Restore the tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &tools |
            build/ci/wasmtime
            build/ci/wabt
            build/ci/ccache
          key: tools-macos-arm64-${{ steps.pins.outputs.tools }}

      - name: Restore what the Makefile fetches
        id: make-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: make-tools-macos-arm64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}-${{ steps.pins.outputs.languages }}
          restore-keys: |
            make-tools-macos-arm64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}-
            make-tools-macos-arm64-${{ inputs.full && 'full' || 'smoke' }}-

      - name: Install wasmtime, wabt, ccache and wasm-tools
        run: .github/scripts/install-tools.sh

      - name: Save the tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Restore Rust
        if: inputs.full
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &rust |
            ~/.rustup/toolchains/${{ steps.pins.outputs.rust }}-*
            ~/.cargo/bin
          key: rust-macos-arm64-${{ steps.pins.outputs.rust }}-rustup${{ steps.pins.outputs.rustup }}

      - name: Install Rust
        if: inputs.full
        run: .github/scripts/install-rust.sh

      - name: Save Rust
        if: inputs.full && steps.rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust
          key: ${{ steps.rust.outputs.cache-primary-key }}

      - name: Restore the toolchains
        if: inputs.full
        id: toolcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &toolcache |
            ${{ runner.tool_cache }}/go/1.27.3
            ${{ runner.tool_cache }}/tinygo/0.44.0
            ${{ runner.tool_cache }}/binaryen
            ${{ runner.tool_cache }}/node/26.13.0
          key: &toolcache-key toolcache-${{ runner.os }}-${{ runner.arch }}-go1.27.3-tinygo0.44.0-binaryen133-node26.13.0

      - &setup-go
        name: Install Go
        if: inputs.full
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false

      - &setup-tinygo
        name: Install TinyGo
        if: inputs.full
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: 0.44.0
          binaryen-version: 133

      - &setup-zig
        name: Install Zig
        if: inputs.full
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - &setup-node
        name: Install Node
        if: inputs.full
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - &save-toolcache
        name: Save the toolchains
        if: inputs.full && steps.toolcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *toolcache
          key: *toolcache-key

      # The JDK is Temurin's newest release, for Kotlin, TeaVM and the Java
      # that calls a warmc shared library through the foreign function API.
      - name: Restore the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full
        id: languages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &languages |
            build/ci/jdk
            build/ci/kotlinc
            build/ci/asc
            ~/.ghc-wasm
          key: languages-macos-arm64-${{ steps.pins.outputs.languages }}

      - name: Install the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full
        run: .github/scripts/install-language-tools.sh jdk kotlin ghc asc

      - name: Save the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full && steps.languages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *languages
          key: ${{ steps.languages.outputs.cache-primary-key }}

      - name: Restore the build caches
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: build-cache-macos-arm64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-cache-macos-arm64-${{ inputs.full }}-
            build-cache-macos-arm64-

      # GitHub's macOS runners are M1s, which lack the instructions the
      # Makefile's default -mcpu=apple-m4 lets the compiler use.
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" all HOST_TUNE=-mcpu=apple-m1

      - name: Build with the sanitizers
        if: inputs.full
        run: make -j"$(sysctl -n hw.ncpu)" asan tsan HOST_TUNE=-mcpu=apple-m1

      - name: Save the build caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Fetch what `make check` needs
        if: inputs.full
        run: make check-tools

      - name: Save what the Makefile fetched
        if: steps.make-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: ${{ steps.make-tools.outputs.cache-primary-key }}

      # The corpora's modules, wasmtime's answers for them, and TeaVM's builds
      # and JVM answers, as test/testcache.py keeps them, each under what it
      # is made of: the same modules as the corpora's directories hold, so no
      # more room.  Only an
      # exact match on every source and pin is restored, so that what is
      # kept never gathers the modules of sources gone since.
      - name: Restore the built corpora
        if: inputs.full
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &corpora |
            build/testcache/corpus
            build/testcache/ref
            build/testcache/teavm
            build/testcache/teavm-ref
          key: corpora-macos-arm64-${{ inputs.full }}-${{ steps.pins.outputs.makefile }}-${{ steps.pins.outputs.producers }}-${{ hashFiles('test/*tests/**', 'test/teavm/**', 'test/gobench.py') }}

      # The test modules assembled from the cases and the interpreter's answers
      # for them, each beside a stamp of what it was made from, so that a
      # restored one is used only while that still matches.  The
      # interpreting is most of what a cold `make smoke` spends; the compiled
      # tests are not kept, since every change to warmc makes them anew.
      - name: Restore the test references
        id: testrun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &testrun |
            build/testrun/*.wasm
            build/testrun/*.wasm.src
            build/testrun/*.stamp
            build/testrun/*.ref
            build/testrun/*.ref.cases
            build/testrun/pressure/want.*
          key: testrun-macos-arm64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testrun-macos-arm64-${{ inputs.full }}-
            testrun-macos-arm64-

      # `make check` starts every row at once, which a workstation takes in
      # its stride; on a runner's three or four virtual cores a compile of a
      # tenth of a second can wait minutes for its turn.  The limits are there
      # for a compile or a run that wedges, not for one that queues: a
      # compile's is CPU time (test/hostenv.sh, test/hostbuild.py), and the
      # clock stops one only at ten times it; a run's is the clock's.
      # The step has a limit of its own, short of the job's, so that a run
      # that wedges anyway fails here and its logs are still kept below.
      - name: Test
        timeout-minutes: ${{ inputs.full && 120 || 10 }}
        env: &test-env
          SUITE: ${{ inputs.full && 'check' || 'smoke' }}
          WARMC_TIMEOUT: 120
          WARMC_RUN_TIMEOUT: 600
          CHECK_BENCH: 0
        run: make -j"$(sysctl -n hw.ncpu)" "$SUITE" HOST_TUNE=-mcpu=apple-m1

      - name: Save the test references
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *testrun
          key: ${{ steps.testrun.outputs.cache-primary-key }}

      - name: Save the built corpora
        if: ${{ inputs.full && !cancelled() && steps.corpora.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *corpora
          key: ${{ steps.corpora.outputs.cache-primary-key }}

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checklogs-macos
          path: build/checklogs
          retention-days: 14

  linux:
    name: Linux arm64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: ${{ inputs.full && 150 || 20 }}
    permissions:
      contents: read # to check out the repository
    env:
      CC: ccache clang
      ASAN_CC: ccache clang
      XCC: ccache clang
      EXTRA_LDFLAGS: -Wl,--thinlto-cache-dir=build/ci-cache/lto
      CCACHE_DIR: ${{ github.workspace }}/build/ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      GOCACHE: ${{ github.workspace }}/build/ci-cache/go-build
      GOTOOLCHAIN: local
      # where TinyGo keeps its cache on Linux
      XDG_CACHE_HOME: ${{ github.workspace }}/build/ci-cache/xdg
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *setup-python

      - *pins

      - name: Restore LLVM
        id: llvm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/llvm
          key: llvm-linux-arm64-${{ steps.pins.outputs.llvm }}

      - name: Install LLVM
        run: .github/scripts/install-llvm.sh

      - name: Save LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - name: Restore the tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *tools
          key: tools-linux-arm64-${{ steps.pins.outputs.tools }}

      - name: Restore what the Makefile fetches
        id: make-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: make-tools-linux-arm64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}-${{ steps.pins.outputs.languages }}
          restore-keys: |
            make-tools-linux-arm64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}-
            make-tools-linux-arm64-${{ inputs.full && 'full' || 'smoke' }}-

      - name: Install wasmtime, wabt, ccache and wasm-tools
        run: .github/scripts/install-tools.sh

      - name: Save the tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Restore Rust
        if: inputs.full
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust
          key: rust-linux-arm64-${{ steps.pins.outputs.rust }}-rustup${{ steps.pins.outputs.rustup }}

      - name: Install Rust
        if: inputs.full
        run: .github/scripts/install-rust.sh

      - name: Save Rust
        if: inputs.full && steps.rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust
          key: ${{ steps.rust.outputs.cache-primary-key }}

      - name: Restore the toolchains
        if: inputs.full
        id: toolcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *toolcache
          key: *toolcache-key

      - *setup-go
      - *setup-tinygo
      - *setup-zig
      - *setup-node
      - *save-toolcache

      - name: Restore the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full
        id: languages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *languages
          key: languages-linux-arm64-${{ steps.pins.outputs.languages }}

      - name: Install the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full
        run: .github/scripts/install-language-tools.sh jdk kotlin ghc asc

      - name: Save the JDK, Kotlin, GHC and AssemblyScript
        if: inputs.full && steps.languages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *languages
          key: ${{ steps.languages.outputs.cache-primary-key }}

      - name: Restore the build caches
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: build-cache-linux-arm64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-cache-linux-arm64-${{ inputs.full }}-
            build-cache-linux-arm64-

      - name: Build
        run: make -j"$(nproc)" all

      - name: Build with the sanitizers
        if: inputs.full
        run: make -j"$(nproc)" asan tsan

      - name: Save the build caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Fetch what `make check` needs
        if: inputs.full
        run: make check-tools

      - name: Save what the Makefile fetched
        if: steps.make-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: ${{ steps.make-tools.outputs.cache-primary-key }}

      - name: Restore the built corpora
        if: inputs.full
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *corpora
          key: corpora-linux-arm64-${{ inputs.full }}-${{ steps.pins.outputs.makefile }}-${{ steps.pins.outputs.producers }}-${{ hashFiles('test/*tests/**', 'test/teavm/**', 'test/gobench.py') }}

      - name: Restore the test references
        id: testrun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *testrun
          key: testrun-linux-arm64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testrun-linux-arm64-${{ inputs.full }}-
            testrun-linux-arm64-

      - name: Test
        timeout-minutes: ${{ inputs.full && 120 || 10 }}
        env: *test-env
        run: make -j"$(nproc)" "$SUITE"

      - name: Save the test references
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *testrun
          key: ${{ steps.testrun.outputs.cache-primary-key }}

      - name: Save the built corpora
        if: ${{ inputs.full && !cancelled() && steps.corpora.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *corpora
          key: ${{ steps.corpora.outputs.cache-primary-key }}

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checklogs-linux
          path: build/checklogs
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.full && 180 || 20 }}
    permissions:
      contents: read # to check out the repository
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ccache clang
      XCC: ccache clang
      EXTRA_LDFLAGS: -Wl,--thinlto-cache-dir=build/ci-cache/lto
      CCACHE_DIR: ${{ github.workspace }}/build/ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      GOCACHE: ${{ github.workspace }}/build/ci-cache/go-build
      GOTOOLCHAIN: local
    steps:
      # The test scripts and their expected outputs must keep their LF line
      # endings, which a Windows checkout would otherwise turn into CRLF.
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CLANG64 is one of the MSYS2 shells the Makefile and test/hostenv.sh
      # know, and its LLVM is the one the job builds with.  The Windows PATH
      # is inherited, so the toolchains the setup actions install are found
      # from inside it.  setup-msys2 installs on D:, which is faster than the
      # image's own MSYS2 on C:, from the installer its release pins, and is
      # not let upgrade it: the upgrade and the job's packages are the files
      # .github/msys2-packages.txt pins, each by its SHA-256, which
      # install-msys2.sh installs in setup-msys2's two passes.  See
      # .github/scripts/pin-msys2.sh for what they are and how to pin anew.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: false
          path-type: inherit

      - name: Restore the MSYS2 packages
        id: msys2-pkgs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/msys2-pkgs
          key: msys2-pkgs-${{ hashFiles('.github/msys2-packages.txt') }}

      - name: Install the MSYS2 packages
        run: .github/scripts/install-msys2.sh 1

      # The first pass may have replaced the MSYS2 runtime under processes
      # still running on the old one, as setup-msys2's own upgrade does.
      - name: End the MSYS2 processes
        shell: pwsh
        run: |
          taskkill /F /FI "MODULES eq msys-2.0.dll"
          exit 0

      - name: Install the MSYS2 packages, the second pass
        run: .github/scripts/install-msys2.sh 2

      - name: Save the MSYS2 packages
        if: steps.msys2-pkgs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/msys2-pkgs
          key: ${{ steps.msys2-pkgs.outputs.cache-primary-key }}

      - *pins

      - name: Restore the tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *tools
          key: tools-windows-x64-${{ steps.pins.outputs.tools }}

      - name: Restore what the Makefile fetches
        id: make-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: make-tools-windows-x64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}
          restore-keys: |
            make-tools-windows-x64-${{ inputs.full && 'full' || 'smoke' }}-${{ steps.pins.outputs.makefile }}-
            make-tools-windows-x64-${{ inputs.full && 'full' || 'smoke' }}-

      - name: Install wasmtime, wabt, ccache and wasm-tools
        run: .github/scripts/install-tools.sh

      - name: Save the tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Restore Rust
        if: inputs.full
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust
          key: rust-windows-x64-${{ steps.pins.outputs.rust }}-rustup${{ steps.pins.outputs.rustup }}

      - name: Install Rust
        if: inputs.full
        run: .github/scripts/install-rust.sh

      - name: Save Rust
        if: inputs.full && steps.rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *rust
          key: ${{ steps.rust.outputs.cache-primary-key }}

      # Not Go: setup-go puts it on D: and only a link to it in the tool cache
      # on C:, so the cache kept the link, a fresh runner restored it pointing
      # at a D: without Go, and setup-go then failed to make the link again
      # (EEXIST).  It downloads Go each time instead.
      - name: Restore the toolchains
        if: inputs.full
        id: toolcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &toolcache-windows |
            ${{ runner.tool_cache }}/tinygo/0.44.0
            ${{ runner.tool_cache }}/binaryen
            ${{ runner.tool_cache }}/node/26.13.0
          key: &toolcache-windows-key toolcache-${{ runner.os }}-${{ runner.arch }}-tinygo0.44.0-binaryen133-node26.13.0

      - *setup-go
      - *setup-tinygo
      - *setup-zig
      - *setup-node

      - name: Save the toolchains
        if: inputs.full && steps.toolcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *toolcache-windows
          key: *toolcache-windows-key

      # Kotlin/Wasm and GHC's wasm backend have no Windows builds here; their
      # corpora skip themselves.
      - name: Restore the JDK and AssemblyScript
        if: inputs.full
        id: languages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &languages-windows |
            build/ci/jdk
            build/ci/asc
          key: languages-windows-x64-${{ steps.pins.outputs.languages }}

      - name: Install the JDK and AssemblyScript
        if: inputs.full
        run: .github/scripts/install-language-tools.sh jdk asc

      - name: Save the JDK and AssemblyScript
        if: inputs.full && steps.languages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *languages-windows
          key: ${{ steps.languages.outputs.cache-primary-key }}

      - name: Restore the build caches
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: build-cache-windows-x64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-cache-windows-x64-${{ inputs.full }}-
            build-cache-windows-x64-

      - name: Build
        run: make -j"$(nproc)" all

      - name: Save the build caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Fetch what `make check` needs
        if: inputs.full
        run: make check-tools

      - name: Save what the Makefile fetched
        if: steps.make-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            build/testsuite
          key: ${{ steps.make-tools.outputs.cache-primary-key }}

      - name: Restore the built corpora
        if: inputs.full
        id: corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *corpora
          key: corpora-windows-x64-${{ inputs.full }}-${{ steps.pins.outputs.makefile }}-${{ steps.pins.outputs.producers }}-${{ hashFiles('test/*tests/**', 'test/teavm/**', 'test/gobench.py') }}

      - name: Restore the test references
        id: testrun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *testrun
          key: testrun-windows-x64-${{ inputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testrun-windows-x64-${{ inputs.full }}-
            testrun-windows-x64-

      - name: Test
        timeout-minutes: ${{ inputs.full && 120 || 10 }}
        env: *test-env
        run: make -j"$(nproc)" "$SUITE"

      - name: Save the test references
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *testrun
          key: ${{ steps.testrun.outputs.cache-primary-key }}

      - name: Save the built corpora
        if: ${{ inputs.full && !cancelled() && steps.corpora.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *corpora
          key: ${{ steps.corpora.outputs.cache-primary-key }}

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checklogs-windows
          path: build/checklogs
          retention-days: 14
